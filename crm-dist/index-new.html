<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeGenie CRM - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .tagline {
            color: #666;
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .metric-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .metric-card .number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 16px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status.loading {
            background: #e7f3ff;
            color: #0066cc;
            display: block;
        }

        .status.error {
            background: #fff3cd;
            color: #856404;
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 OfficeGenie CRM</h1>
            <p class="tagline">Real Estate & Dental Solutions</p>
        </header>

        <div class="dashboard">
            <div class="metric-card">
                <h3>Total Contacts</h3>
                <div class="number" id="totalContacts">0</div>
            </div>
            <div class="metric-card">
                <h3>Total Leads</h3>
                <div class="number" id="totalLeads">0</div>
            </div>
            <div class="metric-card">
                <h3>Total Submissions</h3>
                <div class="number" id="totalSubmissions">0</div>
            </div>
        </div>

        <div class="form-section">
            <h2>Submit a New Lead</h2>

            <div class="status" id="status"></div>

            <form id="contactForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="property">Property Address</label>
                        <input type="text" id="property" name="property">
                    </div>
                    <div class="form-group">
                        <label for="service">Service Type</label>
                        <select id="service" name="service">
                            <option value="">Select...</option>
                            <option value="Real Estate">Real Estate</option>
                            <option value="Dental">Dental</option>
                            <option value="General Inquiry">General Inquiry</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Tell us more about your inquiry..."></textarea>
                </div>

                <button type="submit">Submit Lead</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://officegenie-crm-backend.onrender.com';

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/api/dashboard?scenario=real_estate`);
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const data = await response.json();
                document.getElementById('totalContacts').textContent = data.totalContacts || '0';
                document.getElementById('totalLeads').textContent = data.totalLeads || '0';
                document.getElementById('totalSubmissions').textContent = data.totalSubmissions || '0';
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showStatus('Unable to load dashboard data.', 'error');
            }
        }

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                property: document.getElementById('property').value,
                service: document.getElementById('service').value,
                message: document.getElementById('message').value
            };

            try {
                showStatus('Submitting...', 'loading');
                const response = await fetch(`${API_URL}/api/form-submission`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                showStatus('✓ Lead submitted successfully!', 'success');
                document.getElementById('contactForm').reset();
                setTimeout(loadDashboard, 1000);
            } catch (error) {
                console.error('Error:', error);
                showStatus('Error submitting lead. Please try again.', 'error');
            }
        });

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            if (type === 'success') setTimeout(() => {statusEl.className = 'status';}, 5000);
        }

        window.addEventListener('load', loadDashboard);
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
